# set a pod's DNS ndots option to 4 (Kubernetes default=5) if not explicitly
# set so that typical `<service>.<namespace>.svc.cluster.local` names, which
# have 4 dots, get resolved as absolute names before search-domain expansion

# https://kyverno.io/docs/policy-types/mutating-policy
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-dns-ndots
  labels:
    reports.kyverno.io/disabled: "true"
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  failurePolicy: Ignore

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced

  matchConditions:
    - name: not-explicitly-set
      expression: |-
        !object.?spec.?dnsConfig.?options.orValue([]).exists(o, o.name == "ndots")

  mutations:
    - patchType: ApplyConfiguration
      # NOTE: `options` is an atomic list that cannot
      # be operated on by `ApplyConfiguration`, so we
      # use `JSONPatch` for that field instead
      applyConfiguration:
        expression: |-
          Object{
            spec: Object.spec{
              dnsConfig: Object.spec.dnsConfig{}
            }
          }
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          object.?spec.?dnsConfig.?options.hasValue() ? [] : [
            JSONPatch{
              op:    "add",
              path:  "/spec/dnsConfig/options",
              value: []
            }
          ]
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          [JSONPatch{
            op:    "add",
            path:  "/spec/dnsConfig/options/-",
            value: {
              "name":  "ndots",
              "value": "4"
            }
          }]
