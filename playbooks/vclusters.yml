# https://www.vcluster.com/docs/vcluster/introduction/what-are-virtual-clusters#features-and-plans
# https://www.vcluster.com/docs/vcluster/introduction/architecture
# https://github.com/loft-sh/loft (aka vCluster Platform)
# https://www.vcluster.com/docs/platform/use-platform/virtual-clusters/add-virtual-clusters
#
# UNINSTALLATION STEPS:
# vCluster Platform keeps most of its state in *.storage.loft.sh
# CRs, which are not deleted when the Helm chart is uninstalled;
# the easiest way to purge all state is to use the vCluster CLI:
# kubectl delete crd nodeprofiles.storage.loft.sh \
#    && vcluster platform destroy --non-interactive
---
- name: Install vCluster Platform
  tags:
    - platform
    - cli # login requires access key
  hosts: "{{ rke_control_plane_host }}"
  vars_files:
    - vars/kubernetes.yml
    - vars/monitoring.yml
    - vars/vclusters.yml
  vars:
    # required kubernetes>=24.2 package only in user virtualenv
    ansible_python_interpreter: "{{ venv_python_interpreter }}"
    kubeconfig: "{{ rke_kubeconfig }}"
    secret_ns: "{{ vcluster_platform_namespace }}"
    create_ns: false
  pre_tasks:
    - name: Get CA certificates from PKI
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_tasks_module.html
      ansible.builtin.include_tasks: "{{ tasks_dir }}/pki/cacerts.yml"
      when: ca_certificates is undefined

    - name: Get vCluster Platform access key secret
      # https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_info_module.html
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        name: "{{ vcluster_platform_secrets['api-key'] }}"
        namespace: "{{ secret_ns }}"
      register: vcp_key_secret

    - name: Get vCluster Platform license manifest
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_vars_module.html
      ansible.builtin.include_vars:
        file: "{{ manifests_dir }}/vcluster/license.yaml"
        name: license_manifest # <-- sets this fact
  tasks:
    - name: Create vCluster Platform ingress secret
      vars:
        secret_name: "{{ vcluster_platform_secrets['ingress'] }}"
        create_ns: true
        cert_name: vcluster-platform-ingress
        sans: "{{ [vcluster_platform_fqdn] }}"
      ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/secrets/tls.step.yml"

    - name: Create vCluster Platform password secret
      vars:
        secret_name: "{{ vcluster_platform_secrets['password'] }}"
        secret_data:
          password: "{{ vcluster_admin_pass }}"
      ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/secrets/generic.yml"

    # https://www.vcluster.com/docs/platform/maintenance/backup-restore/preserve-license
    - name: Create vCluster Platform license secret
      # https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        namespace: "{{  secret_ns  }}"
        definition: "{{ license_manifest }}"
        state: present

    - name: Install vCluster Platform Helm chart
      vars:
        repo_name: vcluster
        repo_url: https://charts.loft.sh
        chart_ref: vcluster-platform
        chart_ver: "{{ vcluster_platform_chart_version }}"
        release: "{{ vcluster_platform_release_name }}"
        release_ns: "{{ vcluster_platform_namespace }}"
        values: "{{ vcluster_platform_chart_values }}"

        extras: # adopt extra resources into Helm release
          - cert-manager.io/v1 Certificate {{ vcluster_platform_secrets['ingress'] }}
          - v1 Secret {{ vcluster_platform_secrets['password'] }}
          - v1 Secret {{ vcluster_platform_secrets['api-key']  }} ?
          # these resources are created during bootstrap
          # (there are more *.storage.loft.sh resources)
          - v1 Secret    loft-agent-connection ?
          - v1 Secret    loft-api-service-cert ?
          - v1 Secret    loft-apiservice-agent-cert ?
          - v1 Secret    loft-buildkit-cert ?
          - v1 Secret    loft-cert ?
          - v1 Secret    loft-ingress-wakeup-agent-server-cert ?
          - v1 Secret    loft-license-cache ?
          - v1 Secret    loft-network-control-key ?
          - v1 Secret    loft-server-cert ?
          - v1 Secret    loft-user-secret-admin ?
          - v1 Secret    loft-webhook-agent-cert ?
          - v1 ConfigMap loft-applied-defaults ?
          - v1 ConfigMap loft-derp-region-ids ?
          - v1 ConfigMap loft-ts-ipam ?
      ansible.builtin.include_tasks: "{{ tasks_dir }}/helm/helmfile.yml"

    - name: Create vCluster Platform API access key
      when: vcp_key_secret.resources is falsy
      block:
        - name: Wait until user.storage.loft.sh created
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig }}"
            api_version: storage.loft.sh/v1
            kind: User # cluster-scoped CRD
            name: "{{ homelab_admin.username }}"
          register: vcp_admin_user
          until: vcp_admin_user.resources is truthy
          retries: 12
          delay: 5

        - name: Create vCluster Platform API access key
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            # NOTE: `management.loft.sh` is not an actual
            # CRD API group, but a Kubernetes API service:
            # kubectl get apiservice v1.management.loft.sh
            # kubectl api-resources --api-group=management.loft.sh
            api_version: management.loft.sh/v1
            # https://www.vcluster.com/docs/platform/api/resources/ownedaccesskey
            kind: OwnedAccessKey
            # API ignores `metadata.name` and generates
            # a random name based on `spec.{type,user}`
            definition:
              spec:
                displayName: Admin API access Key
                type: User
                user: "{{ homelab_admin.username }}"
                # contrary to docs, `key` cannot be set to
                # pre-existing value--it must be generated
                ttl: "{{ 365 * 24*60*60 }}" # 1y
            state: present
          register: vcp_access_key

    - name: Create vCluster Platform API key secret
      block:
        # fact will also be used by vCluster CLI login
        - name: Set vcluster_platform_access_key fact
          vars:
            # b64_decode_k8s_secret: plugins/filter/filters.py
            key_secret: |
              {{ vcp_key_secret.resources[0] | b64_decode_k8s_secret
              if vcp_key_secret.resources is truthy else {} }}
          # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/set_fact_module.html
          ansible.builtin.set_fact:
            vcluster_platform_access_key: >-
              {{ key_secret.accessKey if key_secret is truthy else
                 vcp_access_key.result.spec.key }}

        - name: Create vCluster Platform API key secret
          vars:
            key_name: >-
              {{ vcp_key_secret.resources[0].metadata.annotations['access-key-source'] | basename
              if vcp_key_secret.resources is truthy else vcp_access_key.result.metadata.name }}

            # === Inputs ===
            secret_name: "{{ vcluster_platform_secrets['api-key'] }}"
            secret_data:
              accessKey: "{{ vcluster_platform_access_key }}"
            annotations:
              # note the generated `OwnedAccessKey` resource name
              access-key-source: ownedaccesskey.management.loft.sh/{{ key_name }}
          ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/secrets/generic.yml"

# install vCluster: https://www.vcluster.com/install
- name: Install vCluster CLI tool
  tags: cli
  hosts: rke_cluster
  vars_files:
    - vars/kubernetes.yml
    - vars/vclusters.yml
  tasks:
    - name: Install vCluster CLI tool
      become: true
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/shell_module.html
      ansible.builtin.shell: |
        set -o pipefail

        REL="https://github.com/loft-sh/vcluster/releases"
        VER=$(curl -ILs "$REL/latest" | sed -En 's/^location:.+\/tag\/v(.+)\r$/\1/p')

        # check if latest version already installed
        command -v vcluster &> /dev/null && {
          ver=$(v=(`vcluster version`); echo ${v[-1]})
          [ "$ver" == "$VER" ] && exit 9 # no change
        }
        ARCH=$(uname -m | sed -e 's/aarch64/arm64/' -e 's/x86_64/amd64/')
        curl -fsSLo vcluster "$REL/download/v${VER}/vcluster-linux-$ARCH"
        chmod +x vcluster
      args:
        executable: /bin/bash
        chdir: /usr/local/bin
      register: install_cli
      changed_when: install_cli.rc == 0
      failed_when: install_cli.rc not in [0,9]

    - name: Log into vCluster Platform
      vars:
        facts: "{{ hostvars[rke_control_plane_host] }}"
        server_url: https://{{ vcluster_platform_fqdn }}
        access_key: "{{ facts['vcluster_platform_access_key'] }}"
      ansible.builtin.shell: |
        vcluster platform access-key &> /dev/null && exit 9
        vcluster platform  login {{ server_url }} \
                    --access-key {{ access_key }}
      args:
        executable: /bin/bash
      register: cli_login
      changed_when: cli_login.rc == 0
      failed_when: cli_login.rc not in [0,9]

- name: Create tenant clusters on RKE
  tags:
    - install
    - tenants
  hosts: "{{ rke_control_plane_host }}"
  vars_files:
    - vars/kubernetes.yml
    - vars/storage.yml
    - vars/vclusters.yml
  vars:
    # required kubernetes>=24.2 package only in user virtualenv
    ansible_python_interpreter: "{{ venv_python_interpreter }}"
    kubeconfig: "{{ rke_kubeconfig }}"
  pre_tasks:
    - name: Get CA certificates from PKI
      ansible.builtin.include_tasks: "{{ tasks_dir }}/pki/cacerts.yml"
      when: ca_certificates is undefined

    - name: Get mutating webhook config
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: admissionregistration.k8s.io/v1
        kind: MutatingWebhookConfiguration
        name: kyverno-resource-mutating-webhook-cfg
      register: webhook_config

    - name: Gather facts about cluster
      ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/clusterfacts.yml"
      when: kubernetes_version is undefined

    - name: Get tenants to be deleted
      vars:
        keep: "{{ vcluster_tenants | map(attribute='name') | to_json(separators=[',',':']) }}"
      ansible.builtin.shell: |
        # run Bash and source /etc/profile.d
        # scripts so that kubectl is in PATH
        exec /bin/bash -l <<'EOT'
        set -o pipefail

        kubectl get persistentvolumes \
          -l app=vcluster,role=data -o json | \
          jq --argjson keep '{{ keep }}' \
            '[.items[] | .metadata.labels |
              select(.release | IN($keep[]) | not) |
              {name:.release, node}] | sort_by(.name)'
        EOT
      register: rm_vclusters
      changed_when: false
  tasks:
    - name: Create external vCluster
      vars:
        webhooks: |
          {% set webhooks = [] %}
          {% if  webhook_config.resources is truthy  %}
          {%   for  hook in webhook_config.resources[0].webhooks %}
          {%     if hook.clientConfig.service.path | basename
                    in vcluster_kyverno_policies %}
          {%       set _ = webhooks.append(hook) %}
          {%     endif %}
          {%   endfor  %}
          {% endif     %}
          {{ webhooks  }}
      ansible.builtin.include_tasks: "{{ tasks_dir }}/vcluster/create.yml"
      loop: "{{ vcluster_tenants }}"
      loop_control:
        loop_var: vcluster
        label: "{{ vcluster.name ~'|'~ vcluster.node }}"

    - name: Delete external vCluster
      vars:
        rm_list: "{{ rm_vclusters.stdout | from_json }}"
      ansible.builtin.include_tasks: "{{ tasks_dir }}/vcluster/delete.yml"
      loop: "{{ rm_list }}"
      loop_control:
        loop_var: vcluster
        label: "{{ vcluster.name ~'|'~ vcluster.node }}"
