# https://thanos.io/tip/thanos/quick-tutorial.md
---
- name: Install Thanos component suite
  tags: install
  hosts: "{{ rke_control_plane_host }}"
  vars_files:
    - vars/kubernetes.yml
    - vars/storage.yml
    - vars/minio.yml
    - vars/valkey.yml
    - vars/monitoring.yml
    - vars/pyrra.yml
    - vars/thanos.yml
  vars:
    # required kubernetes>=24.2 package only in user virtualenv
    ansible_python_interpreter: "{{ venv_python_interpreter }}"
    kubeconfig: "{{ rke_kubeconfig }}"
    secret_ns: "{{ monitoring_namespace }}"
    create_ns: false
  tasks:
    - name: Create Thanos ingress secret
      vars:
        secret_name: "{{ thanos_secrets[item.name] }}"
        cert_name: "{{ secret_name | replace('tls', 'ingress') }}"
        sans:
          - thanos
          - "{{ item.sans | default([]) }}"
          - "{{ thanos_fqdns[item.name] }}"
          - "*.{{ monitoring_namespace }}.svc.{{ cluster_domain }}"
          - "*.{{ monitoring_namespace }}.svc"
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_tasks_module.html
      ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/secrets/tls.step.yml"
      loop:
        - name: query
          sans: # thanos.fourteeners.local is for Query
            - "{{ monitoring_fqdns['thanos'] | last }}"
        - name: rule
        - name: store
        - name: bucket
        - name: compact
      loop_control:
        label: "{{ item.name }}"

    # for Thanos Ruler to access Thanos Query
    - name: Create Thanos Query client secret
      vars:
        secret_name: "{{ thanos_secrets['query-client'] }}"
        secret_data:
          password: "{{ monitoring_pass }}"
          query.yml: "{{ thanos_query_client | to_nice_yaml(indent=2) }}"
      ansible.builtin.include_tasks: "{{ tasks_dir }}/k8s/secrets/generic.yml"

    - name: Install Thanos Helm chart
      vars:
        repo_name: bitnami
        repo_url: https://charts.bitnami.com/bitnami
        chart_ref: thanos
        chart_ver: "{{ thanos_chart_version }}"
        release: "{{ thanos_release_name }}"
        release_ns: "{{ monitoring_namespace }}"
        values: "{{ thanos_chart_values }}"

        patches:
          merge_patches:
            # patch Query Frontend deployment to use pinned
            # image version due to unresolved startup issue
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: "{{ thanos_release_name }}-query-frontend"
                namespace: "{{ monitoring_namespace }}" # required
              spec:
                template:
                  spec:
                    containers:
                      - name: query-frontend
                        image: "{{ values.image.registry }}/{{
                          values.image.repository }}:{{ thanos_qfe_image_tag }}"

        extras: # adopt extra resources into Helm release
          - cert-manager.io/v1 Certificate thanos-query-ingress
          - cert-manager.io/v1 Certificate thanos-ruler-ingress
          - cert-manager.io/v1 Certificate thanos-storegateway-ingress
          - cert-manager.io/v1 Certificate thanos-bucketweb-ingress
          - cert-manager.io/v1 Certificate thanos-compactor-ingress
          - v1 Secret {{ thanos_secrets['query-client'] }}
          # Thanos tripper ConfigMap for Thanos Query Frontend
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: thanos-query-frontend-tripper
            data: "{{ thanos_tripper_config }}"
      ansible.builtin.include_tasks: "{{ tasks_dir }}/helm/helmfile.yml"
