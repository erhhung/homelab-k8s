# opencode_server_pass:       {vault.yml}
# opencode_channel_secrets.*: {vault.yml}

opencode_namespace: opencode
opencode_host_name: opencode # alias of "ingress"

# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_filters.html#products
opencode_fqdn: "{{ [opencode_host_name] | product(search_domains) | map('join','.') | first }}"

opencode_server_port: 4096

opencode_dev_container:
  image: dev-container
  dev_user: erhhung
  dev_uid: 1000
  dev_group: erhhung
  dev_gid: 1000
  # make sure SSH port matches value defined by
  # `nginx_tcp_services` in vars/kubernetes.yml
  ssh_port: 1222

opencode_secrets:
  ingress: opencode-ingress
  secrets: opencode-secrets
  env-vars: opencode-env-variables
  kubeconfig: opencode-kubeconfig

opencode_configmaps:
  ca-certs: opencode-ca-certificates
  ssh-keys: opencode-ssh-public-keys
  config: opencode-global-config

# use a generic app template chart to host the dev container pod:
# https://github.com/bjw-s-labs/helm-charts/tree/main/charts/other/app-template
opencode_chart_repo_url: https://bjw-s-labs.github.io/helm-charts
opencode_chart_version: "5.0.1"
opencode_release_name: opencode

# https://github.com/bjw-s-labs/helm-charts/tree/main/charts/library/common/values.yaml
opencode_chart_values:
  global:
    nameOverride: dev-container
    createDefaultServiceAccount: false

  # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/controllers
  controllers:
    main:
      enabled: true
      type: statefulset
      revisionHistoryLimit: "{{ k8s_max_revisions }}"
      replicas: 1

      # while this field isn't documented, the schema does define it and it is rendered:
      # https://github.com/bjw-s-labs/helm-charts/tree/common-5.0.1/charts/library/common/schemas/controllers.json
      statefulset:
        podManagementPolicy: OrderedReady
        persistentVolumeClaimRetentionPolicy:
          whenScaled: Retain
          whenDeleted: Delete

        volumeClaimTemplates:
          - name: data
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: "{{ storage_classes['default'] }}"
            size: 5Gi # pretty much all ~/workspace/**

            advancedMounts:
              init:
                - path: /data
              main:
                - path: /etc/pki/ca-trust/extracted
                  subPath: ca-trust
                  readOnly: true
                - path: /etc/ssh/host_keys
                  subPath: host_keys
                  readOnly: true
                - path: "{{ home_dir }}/workspace"
                  subPath: workspace

          - name: home
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: "{{ storage_classes['default'] }}"
            # ~/.vscode-server ~2Gi, ~/.go ~3Gi, ~/.cache ~5Gi,
            # ~/.npm + ~/.local/share/pnpm ~2Gi
            size: 20Gi

            advancedMounts:
              init:
                - path: /home-rw
              main:
                - path: "{{ home_dir }}"
                  subPath: "{{ opencode_dev_container.dev_user }}"

          - name: opencode
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: "{{ storage_classes['default'] }}"
            # ~/.local/share/opencode/opencode.db > 10Gi
            size: 20Gi

            advancedMounts:
              init:
                - path: /opencode
              main:
                - path: "{{ home_dir }}/.config/opencode"
                  subPath: config
                - path: "{{ home_dir }}/.local/share/opencode"
                  subPath: share
                - path: "{{ home_dir }}/.local/state/opencode"
                  subPath: state

          - name: containers
            enabled: true
            accessMode: ReadWriteOnce
            storageClass: "{{ storage_classes['single'] }}"
            # storage for Buildah-created images/containers
            size: 30Gi

            advancedMounts:
              init:
                - path: /containers
              main:
                - path: "{{ home_dir }}/.local/share/containers"
                  subPath: "{{ opencode_dev_container.dev_user }}"
                - path: /var/lib/containers
                  subPath: root

      # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/controllers/pod
      pod:
        terminationGracePeriodSeconds: 10

        # schedule on the node that has the
        # most memory and ephemeral storage
        affinity:
          nodeAffinity:
            # preferredDuringSchedulingIgnoredDuringExecution:
            #   - weight: 100
            #     preference:
            #       matchExpressions:
            #         - key: node-role.kubernetes.io/runner
            #           operator: Exists
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    # label defined in vars/kubernetes.yml
                    - key: node-role.kubernetes.io/runner
                      operator: Exists

      # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/controllers/initcontainers
      initContainers:
        init:
          enabled: true
          image: &dev-image
            pullPolicy: IfNotPresent
            repository: "{{ harbor_container_registry }}/library/{{ opencode_dev_container.image }}"
            tag: latest
          command: ["sh"]
          args:
            - -c
            - |-
              U={{ opencode_dev_container.dev_user  }}
              G={{ opencode_dev_container.dev_group }}
              install="install -o $U -g $G -m"

              [ -d /data/ca-trust  ] || \
                mkdir -p /data/{ca-trust,host_keys}
              [ -d /data/workspace ] || \
                $install 700 -d /data/workspace

              [ -f /data/ca-trust/pem/tls-ca-bundle.pem ] || {
                echo "Adding certs to ca-trust..."
                # /etc/pki/ca-trust/source/anchors already mounted
                update-ca-trust extract
                cp -a /etc/pki/ca-trust/extracted/* /data/ca-trust
                echo
              }
              head -n 27 /data/ca-trust/pem/tls-ca-bundle.pem

              [ -f /data/host_keys/ssh_host_ed25519_key ] || {
                echo "Generating SSH host keys..."
                ssh-keygen -A
                cp -a /etc/ssh/ssh_host_* /data/host_keys
                echo
              }
              cat /data/host_keys/ssh_host_*_key.pub | sort
              echo

              HOME_RW=/home-rw/$U
              [ -d $HOME_RW ] || {
                echo "Setting up /home/$U..."
                cp -a   /home/$U $HOME_RW

                tar  -xf /run/secrets/gnupg.tar -C $HOME_RW
                chown -R $U:$G $HOME_RW/.gnupg
                find $HOME_RW/.gnupg -type d -exec chmod 0700 {} \;
                find $HOME_RW/.gnupg -type f -exec chmod 0600 {} \;
                echo
              }
              ls -al $HOME_RW/

              pnpm_home=.local/share/pnpm
              opencode=$pnpm_home/bin/opencode
              new_ver=$(/home/$U/$opencode --version)
              old_ver=$($HOME_RW/$opencode --version)

              [ "$new_ver" == "$old_ver" ] || {
                printf "\nUpgrading OpenCode %s to %s..." "$old_ver" "$new_ver"
                /usr/bin/rsync --recursive --links --times --delete \
                  /home/$U/$pnpm_home/ \
                  $HOME_RW/$pnpm_home/
                echo "done."
              }

              # always update opencode.json from ConfigMap
              $install 755 -d /opencode/{config,share,state}
              $install 644     /etc/opencode/opencode.json \
                            /opencode/config/opencode.json

              [ -d /containers/$U   ] || \
                $install 700 -d /containers/$U
              [ -d /containers/root ] || \
                mkdir -p /containers/root

      # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/controllers/containers
      containers:
        main:
          image:
            <<: *dev-image
            pullPolicy: Always
          command: ["bash"]
          args:
            - -c
            - |-
              # FIX syslogin_perform_logout logout returned an error
              install -o root -g utmp -m 664 /dev/null /var/run/utmp

              # create file containing envFrom vars that pam_env.so
              # (/etc/pam.d/sshd) will load when SSH session starts
              ENV_FROM=(
                CI_REGISTRY_PASSWORD
                DOCKER_ACCESS_TOKEN
                GITHUB_ACCESS_TOKEN
                SMTP_PASSWORD

                # required to launch TUI
                OPENCODE_SERVER_USERNAME
                OPENCODE_SERVER_PASSWORD
              )
              mkdir  -p /run/sshd
              umask 077
              {
                for var in "${ENV_FROM[@]}"; do
                  printf "%s=%s\n" $var "${!var}"
                done
              } > /run/sshd/session.env

              # stop server: lsof -t -iTCP:4096 -sTCP:LISTEN | xargs -r kill -TERM
              runuser -u {{ opencode_dev_container.dev_user }} -- bash -l -c '
                opencode serve --hostname 0.0.0.0 \
                  --port {{ opencode_server_port }} &
              '
              # sshd will then output
              # "Server listening on"
              sleep 3;  printf 'SSH ' >&2

              # -D: run in foreground for monitoring
              # -e: output error messages to stderr
              exec /usr/sbin/sshd -D -e
          env:
            TZ: "{{ system_time_zone }}"
          envFrom:
            - secretRef:
                name: "{{ opencode_secrets['env-vars'] }}"

          ports:
            - name: ssh
              containerPort: "{{ opencode_dev_container.ssh_port }}"
              protocol: TCP
            - name: http
              containerPort: "{{ opencode_server_port }}"
              protocol: TCP

          # sshd must run as root to perform privilege separation
          # and to switch authenticated sessions to the dev user;
          # passwordless sudo requires `allowPrivilegeEscalation`
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            # allow root to inspect other users' processes
            # in order to show  listening ports by running
            # `sudo lsof -nP -iTCP -sTCP:LISTEN +c0`
            capabilities:
              add:
                - SYS_PTRACE
            # allow building OCI images using Buildah
            appArmorProfile:
              type: Localhost
              localhostProfile: buildah

          resources:
            requests:
              cpu: 500m
              memory: 4Gi
              # ephemeral-storage: 40Gi
            limits:
              cpu: 2000m
              memory: 10Gi
              # ephemeral-storage: 40Gi

          # liveness probe is unnecessary because sshd runs
          # as PID 1 and container will restart if it exits
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                # use `exec` probe instead of `tcpSocket` to prevent
                # sshd from repeatedly logging premature disconnects
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - ss -Hltn 'sport = :{{ opencode_dev_container.ssh_port }}' | grep -q .
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3

  # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/persistence#type-variants
  persistence:
    ca-certs:
      enabled: true
      type: configMap
      name: "{{ opencode_configmaps['ca-certs'] }}"
      defaultMode: 420 # "0644"
      advancedMounts:
        main:
          init:
            - path: /etc/pki/ca-trust/source/anchors
              readOnly: true

    ssh-keys:
      enabled: true
      type: configMap
      name: "{{ opencode_configmaps['ssh-keys'] }}"
      defaultMode: 292 # "0444"
      advancedMounts:
        main:
          main:
            # mount individual *.pub files instead of the entire /etc/ssh/authorized_keys
            # directory because Kubernetes would then give that directory 777 permissions,
            # and with `StrictModes` being default, sshd would reject all containing keys:
            # https://www.man7.org/linux/man-pages/man5/sshd_config.5.html
            - path: /etc/ssh/authorized_keys/{{ opencode_dev_container.dev_user }}.pub
              subPath: "{{ opencode_dev_container.dev_user }}.pub"
              readOnly: true

    secrets1: &secrets
      enabled: true
      type: secret
      name: "{{ opencode_secrets['secrets'] }}"
      defaultMode: 292 # "0444"
      advancedMounts:
        main:
          init:
            - path: /run/secrets/gnupg.tar
              subPath: gnupg.tar
              readOnly: true
          main:
            - path: "{{ home_dir }}/.ssh/config"
              subPath: ssh_config
              readOnly: true
            - path: "{{ home_dir }}/.ssh/erhhung.pem"
              subPath: erhhung.pem
              readOnly: true
            - path: "{{ home_dir }}/.ssh/id_ed25519_auth"
              subPath: id_ed25519_auth
              readOnly: true
            - path: "{{ home_dir }}/.git-credentials"
              subPath: .git-credentials
              readOnly: true
            - path: "{{ home_dir }}/.aws/config"
              subPath: aws_config
              readOnly: true
            - path: "{{ home_dir }}/.aws/credentials"
              subPath: aws_credentials
              readOnly: true

    secrets2:
      <<: *secrets
      items:
        - key: AGE_SECRET_KEY
          path: AGE_SECRET_KEY
        - key: LITELLM_API_KEY
          path: LITELLM_API_KEY
      advancedMounts:
        main:
          main:
            - path: /run/secrets
              readOnly: true

    config:
      enabled: true
      type: configMap
      name: "{{ opencode_configmaps['config'] }}"
      defaultMode: 420 # "0644"
      advancedMounts:
        main:
          init:
            - path: /etc/opencode
              readOnly: true

    kubeconfig:
      enabled: "{{ vcluster_kubeconfig is truthy }}"
      type: secret
      name: "{{ opencode_secrets['kubeconfig'] }}"
      defaultMode: 420 # "0644"
      advancedMounts:
        main:
          main:
            - path: "{{ home_dir }}/.kube/config-vclusters"
              subPath: config
              readOnly: true

    # NFS mount for file sharing between local desktop and
    # the dev container (this is separate from ~/workspace,
    # which support FS events when OpenCode makes changes)
    nfs-share:
      enabled: true
      type: nfs
      server: "{{ homelab_nfs.server }}"
      path: "{{   homelab_nfs.base_path }}/opencode"
      advancedMounts:
        main:
          main:
            - path: "{{ home_dir }}/nfs-share"

  # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/service
  service:
    main:
      enabled: true
      primary: true
      controller: main
      type: ClusterIP
      ports:
        # SSH traffic will be forwarded by Nginx ingress controller
        # as defined by `nginx_tcp_services` in vars/kubernetes.yml
        ssh:
          primary: true
          protocol: TCP
          port: "{{ opencode_dev_container.ssh_port }}"
        http:
          protocol: HTTP
          port: "{{ opencode_server_port }}"

  # https://bjw-s-labs.github.io/helm-charts/docs/app-template/reference/ingress
  ingress:
    main:
      enabled: true
      tls:
        - secretName: "{{ opencode_secrets['ingress'] }}"
          hosts: "{{     [opencode_fqdn] }}"
      className: "{{  rke_ingress_class  }}"
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTP

        # avoid 502 Bad Gateway due to "upstream sent too big header while reading response header from upstream":
        # https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations#proxy-buffer-size
        nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
      hosts:
        - host: "{{ opencode_fqdn }}"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http

# config will be rendered as JSON and mounted
# at "$XDG_CONFIG_HOME/opencode/opencode.json"
# https://opencode.ai/docs/config
opencode_config:
  # OpenCode is baked into the Docker image,
  # so a pod restart will lose any updates:
  # https://opencode.ai/docs/config#autoupdate
  autoupdate: false

  # https://opencode.ai/docs/providers#custom-provider
  # https://opencode.ai/docs/providers#example
  provider:
    litellm:
      npm: "@ai-sdk/openai" # /responses API
      name: LiteLLM
      options:
        baseURL: "{{ litellm_service_url }}/v1"
        # https://opencode.ai/docs/config#variables
        apiKey: "{file:/run/secrets/LITELLM_API_KEY}"
        # apiKey: "{env:LITELLM_API_KEY}"

        # overall request + response timeout in ms
        timeout: 3600000 # 60m
        # timeout between streamed response chunks
        chunkTimeout: 600000 # 10m

      # model auto-discovery hasn't been implemented
      # yet, so manually list models to pass through:
      # https://github.com/anomalyco/opencode/issues/6231

      # model cost fields aren't described by the docs,
      # but are specified in the config's JSON schema:
      # curl -fsSL https://opencode.ai/config.json | \
      #   jq '.. | objects | .properties?.cost? // empty'

      # model cost values are $USD per million tokens:
      # https://github.com/anomalyco/opencode/tree/dev/packages/opencode/src/session/session.ts#L380-L405
      # NOTE: run all cost values through `round(8)` to prevent
      # floating-point precision issue like 0.09999999999999999
      models: |
        {% set models = {} %}
        {% for model in litellm_models %}
        {%   if model.litellm_params['model'] is match('^chatgpt') %}
        {%     set info = model.model_info %}
        {%     set    _ = models.update({
                 model.model_name: {
                   'name':   info.display_name,
                   'limit':  {
                     'context': info.max_input_tokens,
                     'output':  info.max_output_tokens,
                   },
                   'cost':  {
                     'input':       (1000000 * info.input_cost_per_token)            | round(8),
                     'output':      (1000000 * info.output_cost_per_token)           | round(8),
                     'cache_read':  (1000000 * info.cache_read_input_token_cost)     | round(8),
                     'cache_write': (1000000 * info.cache_creation_input_token_cost) | round(8),
                   },
                 }
               })  %}
        {%   endif %}
        {% endfor  %}
        {{ models  }}

  # only allow models proxied via LiteLLM:
  # https://opencode.ai/docs/config#enabled-providers
  enabled_providers:
    - litellm

  # https://opencode.ai/docs/config#models
  model: litellm/{{ litellm_default_model }}
  small_model: litellm/{{ litellm_small_model }}

  # https://opencode.ai/docs/config#mcp-servers
  mcp:
    playwright:
      enabled: true
      type: local
      command:
        - npx
        - -y
        # IMPORTANT! make sure MCP server's Playwright
        # client version matches the Playwright server
        # version. verify by running this command:
        # npm view @playwright/mcp@0.0.78 dependencies.playwright
        - "@playwright/mcp@{{ playwright_mcp_version }}"
        # https://github.com/microsoft/playwright-mcp#configuration
        - --endpoint
        - "{{ playwright_service_url }}"
        - --isolated

  # https://opencode.ai/docs/config#plugins
  plugin:
    # https://github.com/leecoder/opencode-slack-agent
    #
    # HINT: to link an OpenCode session to a thread in Slack, first post a
    # message containing the name of the OpenCode session to the #opencode
    # Slack channel, then click on the message's "Reply in thread" button
    # to show the Thread side panel, then reply with:
    #   @OpenCode !attach ses_<session_id>
    # where <session_id> is the ID shown by running `opencode session list`
    # in the project directory (use Slack auto-complete to mention the bot,
    # and make sure the OpenCode server with the plugin is already running)
    # confirm the bot is connected by sending a follow-up reply:
    #   @OpenCode !dir
    # - - opencode-slack-agent
    # use manually installed plugin version from unmerged PR in
    # order to get Slack messages in English instead of Korean:
    # https://github.com/leecoder/opencode-slack-agent/pull/12
    #   mkdir -p ~/.config/opencode/plugins
    #   git clone https://github.com/leecoder/opencode-slack-agent.git \
    #      ~/.config/opencode/plugins/slack-agent-pr12
    #   cd ~/.config/opencode/plugins/slack-agent-pr12
    #   git fetch origin pull/12/head
    #   git checkout --detach FETCH_HEAD
    #   npm install
    #   npm run build
    - - ./plugins/slack-agent-pr12/dist/plugin.js
      # SLACK_APP_TOKEN & SLACK_BOT_TOKEN
      # are set via environment variables
      - ALLOWED_USERS: "{{ user_erhhung.slack.id }}"
        LANGUAGE: en

  # https://opencode.ai/docs/config#shell
  shell: bash

  # never share conversations
  # on OpenCode cloud servers:
  # https://opencode.ai/docs/share
  # https://opencode.ai/docs/config#sharing
  share: disabled

  # https://opencode.ai/docs/config#watcher
  watcher:
    ignore:
      - .git/**
      - .venv/**
      - node_modules/**
      - build/**
      - dist/**
      - bazel-*

  # preserve context automatically
  # while removing old tool output:
  # https://opencode.ai/docs/config#compaction
  compaction:
    auto: true
    prune: true

  # https://opencode.ai/docs/permissions
  # https://opencode.ai/docs/config#permissions
  permission:
    # https://opencode.ai/docs/permissions#external-directories
    external_directory:
      ~/workspace/**: allow
      ~/nfs-share/**: allow
      ~/.vscode-server/**: allow
      ~/.cache/**: allow
      ~/.go/**: allow
      ~/go/**: allow
      "**/bin/*": allow
      /usr/**: allow
      /opt/**: allow
      /etc/**: allow
      /tmp/**: allow

    bash:
      "*": allow
      "sudo*": ask
      "rm -rf*": ask
      "git push*": ask
      "git clean*": ask
      "git reset --hard*": ask
