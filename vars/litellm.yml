# litellm_admin_pass: {vault.yml}
# litellm_master_key: {vault.yml}
# litellm_minio_key:  {vault.yml}
# litellm_pg_pass:    {vault.yml}
# litellm_vk_pass:    {vault.yml}
# icloud_smtp.*:      {vault.yml}
# anthropic_api_key:  {vault.yml}
#    openai_api_key:  {vault.yml}
#      groq_api_key:  {vault.yml}

litellm_namespace: litellm
litellm_enable_istio: true
litellm_use_waypoint: true

litellm_host_name: litellm # alias of "ingress"

# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_filters.html#products
litellm_fqdn: "{{ [litellm_host_name] | product(search_domains) | map('join','.') | first }}"

litellm_service_host: "{{ litellm_release_name }}.{{
  litellm_namespace }}.svc.{{ cluster_domain }}"
litellm_service_port: 4000
litellm_service_url: http://{{ litellm_service_host }}:{{ litellm_service_port }}

litellm_secrets:
  ingress: litellm-ingress-tls
  database: litellm-database-tls
  env-vars: litellm-env-variables
  chatgpt: litellm-chatgpt-auth
  api-keys: litellm-api-keys

litellm_db_name: litellm
litellm_db_user: litellm
# {{ litellm_pg_pass }}

# LiteLLM uses Prisma for ORM, which requires the client cert
# in PKCS#12 format, and uses different URL params than libpq:
# https://prisma.github.io/quaint/src/quaint/pooled.rs.html
litellm_postgresql_url: >-
  {% set params = {
       'sslmode':     'require',
       'sslcert':     '/tls/database/ca.crt',
       'sslidentity': '/tls/database/keystore.p12',
       'sslpassword': 'changeit',
       'sslaccept':   'strict',
     } -%}
  {% set items = params | dict2items -%}
  {% set params = items | map(attribute='key')    |
              zip(items | map(attribute='value')) |
                    map('join','=') -%}
  {% set query = params | join('&') -%}
  postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD){{
    '@' }}$(DATABASE_HOST)/$(DATABASE_NAME)?{{ query }}

# https://docs.litellm.ai/docs/proxy/deploy#helm-chart
litellm_chart_oci_url: oci://docker.litellm.ai/berriai/litellm-helm
# https://github.com/BerriAI/litellm/tree/main/helm/litellm-helm
# IMPORTANT: see relevant release notes
# for breaking changes before upgrading:
# https://docs.litellm.ai/release_notes
litellm_chart_version: "1.108.3"
litellm_release_name: litellm

litellm_image:
  repository: ghcr.io/berriai/litellm-database
  # skopeo list-tags docker://ghcr.io/berriai/litellm-database | \
  #   jq -r '.Tags | sort[] | capture("^(?<t>([0-9]+[.])+[0-9]+.*$)").t'
  tag: "{{ litellm_chart_version }}"
  pullPolicy: IfNotPresent

# https://github.com/BerriAI/litellm/tree/main/helm/litellm-helm/values.yaml
litellm_chart_values:
  replicaCount: 1
  # numWorkers: 2

  # use Recreate deployment strategy to avoid
  # multi-attach error on ReadWriteOnce PVCs
  strategy:
    type: Recreate

  image: "{{ litellm_image }}"

  envVars:
    # https://docs.litellm.ai/docs/proxy/ui#4-sign-in-for-the-first-time
    UI_USERNAME: bootstrap
    # https://docs.litellm.ai/docs/proxy/ui#6-configure-root-redirect-url
    ROOT_REDIRECT_URL: /ui
    DOCS_URL: /docs

    # Prisma migration uses v2 migration
    # resolver, which uses psycopg/libpq
    PGSSLCERT: /tls/database/tls.crt
    PGSSLKEY: /tls/database/tls.key
    PGSSLROOTCERT: /tls/database/ca.crt

    # https://docs.litellm.ai/docs/proxy/email
    SMTP_HOST: "{{ icloud_smtp.host }}"
    SMTP_PORT: "{{ icloud_smtp.port }}"
    SMTP_TLS: "true"
    SMTP_SENDER_EMAIL: LiteLLM <{{ icloud_smtp.from_email }}>

    # https://docs.litellm.ai/docs/providers/chatgpt#configuration
    # /data is PVC-mounted volume
    CHATGPT_TOKEN_DIR: /data/chatgpt
    CHATGPT_AUTH_FILE: auth.json

    JSON_LOGS: "true"
    # TZ in the container only affects log timestamps
    TZ: "{{ system_time_zone }}"
    # detailed debug includes provider request/response
    DETAILED_DEBUG: "false"

    # essentially the same as default value of 1000, but suppresses
    # log "Spend Log: response was truncated before storing in DB."
    MAX_STRING_LENGTH_PROMPT_IN_DB: "1024"
    # flush logs every 2s to avoid accumulating
    # large request/response payloads in memory
    DEFAULT_S3_FLUSH_INTERVAL_SECONDS: "2" # default=10

  # this setting renders the $LITELLM_LOG env var
  logLevel: INFO # DEBUG|INFO|WARNING|ERROR|CRITICAL

  environmentSecrets:
    # UI_PASSWORD, LITELLM_MASTER_KEY, ...
    - "{{ litellm_secrets['env-vars'] }}"

  masterkeySecretName: "{{ litellm_secrets['env-vars'] }}"
  masterkeySecretKey: LITELLM_MASTER_KEY # $PROXY_MASTER_KEY

  # https://docs.litellm.ai/docs/proxy/config_settings
  proxy_config:
    model_list: "{{ litellm_models }}"
    search_tools: "{{ litellm_search_tools }}"

    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      # disable $UI_USERNAME & $UI_PASSWORD
      disable_env_credential_login: true
      # hide credentials hint on login form
      hide_default_credentials_hint: true

      # disable Prisma schema migration on
      # startup--use migration Job instead
      disable_prisma_schema_update: true
      # no need to refresh from DB every
      # 30s when we only have one replica
      # and don't make changes via the UI
      proxy_config_reload_interval_seconds: 300

      # enable storing models & credentials
      # in the database instead of just the
      # config file, which isn't persistent
      # for a volume-mounted ConfigMap
      store_model_in_db: true
      # prevent sheer volume of prompts and
      # responses from cluttering database;
      # store them in the S3 bucket instead
      store_prompts_in_spend_logs: false
      # track spending stats for up to one year
      maximum_spend_logs_retention_period: 366d

      # https://docs.litellm.ai/docs/proxy/alerting
      alerting:
        - slack
        # - email

      # https://docs.litellm.ai/docs/proxy/alerting#all-possible-alert-types
      alert_types:
        - db_exceptions
        - llm_exceptions
        # - llm_too_slow
        - llm_requests_hanging
        # - cooldown_deployment
        - outage_alerts
        - budget_alerts
        - spend_reports
        # - daily_reports
        # - new_model_added

      # sends alert if requests hang
      # for Xm and responses take Xm
      alerting_threshold: 300 # 5m
      spend_report_frequency: 7d

      # https://docs.litellm.ai/docs/proxy/alerting#digest-mode-reducing-alert-noise
      alert_type_config:
        db_exceptions: &alert-digest
          digest: true
          digest_interval: 3600 # 1h
        llm_exceptions: *alert-digest
        llm_requests_hanging: *alert-digest

      # https://docs.litellm.ai/docs/proxy/alerting#alerting_args-specification
      alerting_args:
        outage_alert_ttl: 300 # 5m
        minor_outage_alert_threshold: 25
        major_outage_alert_threshold: 50

    litellm_settings:
      # only affects `budget_reset_time`, NOT usage/spend buckets:
      # https://github.com/BerriAI/litellm/issues/31831
      timezone: "{{ system_time_zone }}"

      # https://docs.litellm.ai/docs/proxy/caching
      cache: true
      cache_params:
        type: redis
        # redis_startup_nodes is list of {host,port} dicts:
        # https://docs.ansible.com/ansible/latest/collections/community/general/dict_kv_filter.html
        redis_startup_nodes: "{{ valkey_node_fqdns |
          map('community.general.dict_kv', 'host') |
          map('ansible.builtin.combine',  {'port': valkey_service_port}) }}"
        # redis-py kwargs for mTLS:
        # https://docs.litellm.ai/docs/proxy/caching#step-2-add-redis-credentials-to-env
        ssl: true
        ssl_check_hostname: true
        ssl_cert_reqs: required
        ssl_ca_certs: /tls/database/ca.crt
        ssl_certfile: /tls/database/tls.crt
        ssl_keyfile: /tls/database/tls.key
        password: os.environ/REDIS_PASSWORD
        namespace: "#litellm#"
        ttl: 600

      callbacks:
        # https://docs.litellm.ai/docs/response_api#session-management
        - s3_v2
        # enable /metrics endpoint for ServiceMonitor:
        # https://docs.litellm.ai/docs/proxy/prometheus
        - prometheus

      # store prompts and responses in MinIO bucket instead
      # of database (`store_prompts_in_spend_logs` setting)
      # objects in the bucket will expire after 7 days (see
      # bucket lifecycle rules in vars/minio.configure.yml)
      cold_storage_custom_logger: s3_v2

      # https://docs.litellm.ai/docs/proxy/logging#s3-buckets
      s3_callback_params:
        s3_aws_access_key_id: litellm
        s3_aws_secret_access_key: os.environ/AWS_SECRET_KEY
        s3_endpoint_url: "{{ minio_service_url }}"
        s3_region_name: "{{  minio_region }}"
        s3_bucket_name: litellm
        # s3_path: optional/prefix/
        s3_partition_granularity: day # day|hour
        s3_max_concurrent_uploads: 4 # default=16

      # https://docs.litellm.ai/docs/proxy/ai_hub
      # mark models as public in the Model Hub (this config file
      # method is currently undocumented but mentioned in issue):
      # https://github.com/BerriAI/litellm/issues/14776#issuecomment-3321512091
      public_model_groups: "{{ litellm_models | map(attribute='model_name') }}"

      # drop unsupported OpenAI params for providers/models that
      # don't support them--this is required on Anthropic models
      # to prevent "store: Extra inputs are not permitted" error
      # https://docs.litellm.ai/docs/completion/drop_params
      drop_params: true

  redis:
    # don't install Redis as we already
    # have a multi-node Valkey cluster
    enabled: false

  db:
    # don't install PostgreSQL as we already
    # have a PostgreSQL HA cluster deployed
    deployStandalone: false
    useExisting: true

    secret:
      name: "{{ litellm_secrets['env-vars'] }}"
      usernameKey: database_username # $(DATABASE_USERNAME)
      passwordKey: database_password # $(DATABASE_PASSWORD)
    database: "{{ litellm_db_name }}" # $(DATABASE_NAME)
    endpoint: "{{ pgpool_service_host }}:{{ pgpool_service_port }}" # $(DATABASE_HOST)
    url: "{{ litellm_postgresql_url }}" # contains $(DATABASE_*) env var references

    # IMPORTANT: add "litellm:primary" to PgPool's `database_redirect_preference_list`
    # so that Prisma upsert queries don't fail due to read-after-write inconsistency:
    # HTTP 500: Query upsertOneXXX is required to return data, but found no record(s)

  # perform Prisma schema migration via
  # Helm hook instead of on pod startup
  # in case there are multiple replicas
  migrationJob:
    enabled: true
    retries: 1
    hooks:
      helm:
        enabled: true
      argocd:
        enabled: false
    # support for extraInitContainers is a new
    # chart feature that hasn't been published,
    # so also add it as a Helmfile merge patch
    extraInitContainers:
      - "{{ litellm_job_init_container }}"
    ttlSecondsAfterFinished: 600

  serviceAccount:
    create: true
    # add Helm hook annotations so that the
    # migration Job pod starts successfully:
    # https://github.com/BerriAI/litellm/issues/20571
    # annotations:
    #   helm.sh/hook: pre-install
    #   helm.sh/hook-weight: "1"

  podSecurityContext:
    fsGroup: 1000
  securityContext:
    # all files & dirs in container are owned by root
    runAsUser: 0
    capabilities:
      drop: ["ALL"]
    allowPrivilegeEscalation: false
    # both LiteLLM and Prisma require write access to
    # various paths in addition to /.cache, /.npm and
    # /tmp, such as /usr/lib/python3.13/site-packages
    # and /app/litellm/proxy/_experimental/out
    readOnlyRootFilesystem: false

  resources:
    requests:
      cpu: 25m
      memory: 1Gi

  # allow up to 10 minutes for LiteLLM to fully
  # initialize if ChatGPT auth flow is required
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  volumes:
    # keep as first item
    - name: database-tls
      secret:
        secretName: "{{ litellm_secrets['database'] }}"
        defaultMode: 416 # "0640"
    - name: ca-bundle
      emptyDir: {}
    - name: chatgpt-auth
      secret:
        secretName: "{{ litellm_secrets['chatgpt'] }}"
        defaultMode: 256 # "0400"
    - name: litellm-data
      persistentVolumeClaim:
        claimName: "{{ litellm_release_name }}-data"

  volumeMounts:
    # keep as first item
    - name: database-tls
      mountPath: /tls/database
      readOnly: true
    - name: ca-bundle
      # container sets `SSL_CERT_FILE` to this path
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: ca-bundle.crt
      readOnly: true
    - name: litellm-data
      mountPath: /data

  ingress:
    enabled: true
    tls:
      - secretName: "{{ litellm_secrets['ingress'] }}"
        hosts: "{{     [litellm_fqdn] }}"
    className: "{{  rke_ingress_class }}"
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: HTTP

      # avoid 502 Bad Gateway due to "upstream sent too big header while reading response header from upstream":
      # https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations#proxy-buffer-size
      nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
    hosts:
      - host: "{{ litellm_fqdn }}"
        paths:
          - path: /
            pathType: Prefix

  serviceMonitor:
    enabled: true
    labels: "{{ monitoring_selector_labels }}"
    interval: 30s

  extraResources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ litellm_release_name }}-data"
        labels:
          # add labels manually because the Helm
          # template doesn't run YAML thru `tpl`
          app.kubernetes.io/name: litellm
          app.kubernetes.io/instance: "{{ litellm_release_name }}"

        # just like with the service account, the PVC
        # needs Helm hook annotations so that it gets
        # created before the migrations Job can start
        # annotations:
        #   helm.sh/hook: pre-install
        #   helm.sh/hook-weight: "1"
      spec:
        storageClassName: "{{ storage_classes['default'] }}"
        # volume is mounted by main pod and
        # by migrations Job on Helm upgrade
        # accessModes: ["ReadWriteMany"]
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # min XFS volume size is 300Mi
            storage: 384Mi

  extraInitContainers:
    # add private CA certificate to system CA bundle
    # so LiteLLM can reach MinIO with $SSL_CERT_FILE
    - name: ca-bundle
      image: "{{ litellm_image.repository ~':'~ litellm_image.tag }}"
      imagePullPolicy: IfNotPresent
      command: ["bash"]
      args:
        - -c
        - |-
          set -eo pipefail

          # container image already sets SSL_CERT_FILE to system CA bundle
          printf "%s\n\n%s\n" "$(< $SSL_CERT_FILE)" "$(< /tls/ca.crt)" | \
            tee /ssl/ca-bundle.crt | tail -n 11

      volumeMounts:
        - name: database-tls
          mountPath: /tls
          readOnly: true
        - name: ca-bundle
          mountPath: /ssl

    # copy possibly expired ChatGPT auth tokens
    # from Secret to PVC-backed volume; ChatGPT
    # authenticator may refresh access token in
    # next init container
    - name: copy-auth
      image: backplane/jq
      imagePullPolicy: IfNotPresent
      command: ["sh"]
      args:
        - -c
        - |-
          set -eo pipefail

          get_exp() {
            [ -f "$1" ] || { echo 0; return; }
            jq -r '.expires_at // 0' "$1"
          }
          exp_out() {
            date -ud "@$1" '+%Y-%m-%dT%H:%M:%SZ'
          }
            src="/src/chatgpt/auth.json"
          dest="/data/chatgpt/auth.json"

           src_exp=$(get_exp $src)
          dest_exp=$(get_exp $dest)

          if [ "$src_exp" -gt "$dest_exp" ]; then
            mkdir -p /data/chatgpt
            cp    -f  $src $dest
            chmod      600 $dest

          elif [ "$dest_exp" -gt 0 ]; then
            echo "Existing ChatGPT token expiration is newer:"
            echo "$(exp_out $dest_exp) >= $(exp_out $src_exp)"
            exit
          fi

      volumeMounts:
        - name: chatgpt-auth
          mountPath: /src/chatgpt/auth.json
          subPath: auth.json
          readOnly: true
        - name: litellm-data
          mountPath: /data

    - name: gpt-oauth
      image: "{{ litellm_image.repository ~':'~ litellm_image.tag }}"
      imagePullPolicy: IfNotPresent
      command: ["python"]
      args:
        - -c
        - |-
          # https://github.com/BerriAI/litellm/tree/main/litellm/llms/chatgpt/authenticator.py#L84
          from litellm.llms.chatgpt.authenticator import Authenticator
          import json

          class TracedAuthenticator(Authenticator):
              def __init__(self):
                  super().__init__()
                  self.device_code_requested = False

              def _request_device_code(self):
                  self.device_code_requested = True
                  return super()._request_device_code()

          auth  = TracedAuthenticator()
          token = auth.get_access_token()

          # confirm that returned credentials were persisted
          # LiteLLM logs write errors but doesn`t raise them
          print() if auth.device_code_requested else None

          with open(auth.auth_file, "r+", encoding="utf-8") as f:
              saved = json.load(f)

              if saved.get("access_token") != token:
                  raise RuntimeError("Access token was not persisted")

              if not saved.get("refresh_token") or not saved.get("id_token"):
                  raise RuntimeError("Auth file is missing required tokens")

          print("👍 ChatGPT credentials are ready.")
      env:
        - name: CHATGPT_TOKEN_DIR
          value: /data/chatgpt
        - name: CHATGPT_AUTH_FILE
          value: auth.json
        - name: LITELLM_LOG
          value: ERROR

      volumeMounts:
        - name: litellm-data
          mountPath: /data

# create litellm database if it doesn't
# exist before running Prisma migration
litellm_job_init_container:
  name: create-database
  image: "{{ postgresql_image }}"
  imagePullPolicy: IfNotPresent
  command: ["bash"]
  args:
    - -c
    - |-
      # uses connection params added
      # by PG* environment variables
      db_found=$(psql -d postgres -tAc "
        SELECT COUNT(*) FROM pg_catalog.pg_database WHERE datname = '$PGDATABASE'
      ") || exit $?
      echo "db_found=$db_found"

      [ "$db_found" -eq 1 ] || {
        echo -e "\nCreating '$PGDATABASE' database..."
        psql -d postgres <<EOT

      -- https://www.postgresql.org/docs/current/sql-createdatabase.html
      CREATE DATABASE $PGDATABASE WITH OWNER $PGUSER;
      REVOKE ALL ON DATABASE $PGDATABASE FROM PUBLIC;
      GRANT  ALL ON DATABASE $PGDATABASE  TO $PGUSER;
      EOT
      }
      echo -e "\nDatabase initialization completed ✓"
  env:
    # https://www.postgresql.org/docs/current/libpq-envars.html
    - name: PGHOST
      value: "{{ pgpool_service_host }}"
    - name: PGUSER
      value: "{{ litellm_db_user }}"
    - name: PGDATABASE
      value: "{{ litellm_db_name }}"
    - name: PGSSLMODE
      value: verify-full
    - name: PGSSLCERT
      value: /tls/tls.crt
    - name: PGSSLKEY
      value: /tls/tls.key
    - name: PGSSLROOTCERT
      value: /tls/ca.crt

  volumeMounts:
    - name: database-tls
      mountPath: /tls
      readOnly: true
