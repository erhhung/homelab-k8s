# ingress for bare subdomain routes to Query
thanos_subdomain: thanos.{{ homelab_domain }}

# aliases of "ingress"
thanos_host_names:
  query:
    - query
    - querier
  rule:
    - ruler
    - rule
  store:
    - storegateway
    - store
  bucket:
    - bucketweb
    - bucket
  compact:
    - compactor
    - compact

# e.g. {query:["query.thanos.fourteeners.local","querier.thanos.fourteeners.local"],...}
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_filters.html#products
thanos_fqdns: |
  {% set fqdns  = {} %}
  {% for service, names in thanos_host_names.items() %}
  {#   create partially qualified domains #}
  {#   append: plugins/filter/filters.py  #}
  {%   set pqdns = names | map('append', '.thanos')  %}
  {%   set _ = fqdns.update({
         service: pqdns | product(search_domains) | map('join','.')
       }) %}
  {% endfor %}
  {{ fqdns  }}

# e.g. {store:"thanos-storegateway.monitoring.svc.cluster.local",...}
thanos_service_hosts: |
  {% set hosts  = {} %}
  {% for service, names in thanos_host_names.items() %}
  {%   set _ = hosts.update({
         service: thanos_release_name ~'-'~ names[0] ~'.'~
           monitoring_namespace ~'.svc.'~ cluster_domain
       })   %}
  {% endfor %}
  {{ hosts  }}
thanos_query_frontend_url: https://{{ thanos_release_name }}-query-frontend.{{
  monitoring_namespace }}.svc.{{ cluster_domain }}:{{ prometheus_service_port }}

thanos_secrets:
  query: thanos-query-tls
  rule: thanos-ruler-tls
  store: thanos-storegateway-tls
  bucket: thanos-bucketweb-tls
  compact: thanos-compactor-tls
  sidecar: "{{ monitoring_secrets['thanos-tls'] }}"
  http-config: "{{ monitoring_secrets['thanos-config'] }}"
  object-store: "{{ monitoring_release_name }}-prometheus"
  query-client: thanos-query-client

# "query.yml" config in Secret for
# Thanos Ruler HTTPS Query client
thanos_query_client:
  - static_configs:
      - dnssrv+_http._tcp.{{ thanos_service_hosts['query'] }}.
    scheme: https
    http_config:
      tls_config:
        server_name: "{{ thanos_service_hosts['query'] }}"
        ca_file: /tls/thanos/ca.crt
      basic_auth:
        username: thanos
        password_file: /conf/query-client/password

# ConfigMap is mounted in Query Frontend
# container at /conf/tripper/config.yml:
# https://thanos.io/tip/components/query-frontend.md#recommended-downstream-tripper-configuration
thanos_tripper_config:
  config.yml: |-
    idle_conn_timeout:       10m
    max_idle_conns_per_host: 100
    max_idle_conns:          100 # max_idle_conns_per_host * .query.replicaCount
    # https://github.com/thanos-io/thanos/tree/main/pkg/queryfrontend/config.go#L186
    tls_config:
      # same cert as http-config.yml
      cert_file: /tls/thanos/tls.crt
      key_file:  /tls/thanos/tls.key
      ca_file:   /tls/thanos/ca.crt

# common readinessProbe & livenessProbe config
# that includes httpGet header for basic auth
thanos_probe:
  httpGet:
    path: /- # will be overridden
    port: http
    scheme: HTTPS
    httpHeaders:
      - name: Authorization
        value: Basic {{ ('probe:'~ monitoring_passwords['probe']) | b64encode }}
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 6

# https://github.com/bitnami/charts/tree/main/bitnami/thanos
thanos_chart_version: "17.3.1"
thanos_release_name: thanos

# Query Frontend in Thanos 0.39.x fails to start,
# so we use Helmfile patch to pin that component:
# https://github.com/thanos-io/thanos/issues/8448
thanos_qfe_image_tag: v0.38.0

# https://github.com/bitnami/charts/tree/main/bitnami/thanos/values.yaml
thanos_chart_values:
  global:
    security:
      # use quay.io registry because Bitnami
      # no longer offers free public images
      allowInsecureImages: true

  image:
    # https://quay.io/repository/thanos/thanos?tab=tags
    registry: quay.io
    repository: thanos/thanos
    tag: v0.42.4 # search: v0

  # https://thanos.io/tip/operating/https.md
  # this secret was created for the Thanos sidecar and
  # contains "http-config.yml" that this chart expects
  existingHttpConfigSecret: "{{ thanos_secrets['http-config'] }}"

  # https://thanos.io/tip/thanos/storage.md#s3
  # re-use MinIO config for Thanos sidecar from secret defined
  # in vars/monitoring.yml under prometheus_stack_chart_values.
  # prometheus.prometheusSpec.thanos.objectStorageConfig.secret
  existingObjstoreSecret: "{{ thanos_secrets['object-store'] }}"
  existingObjstoreSecretItems:
    # named by kube-prometheus-stack
    - key: object-storage-configs.yaml
      # name expected by bitnami/thanos
      path: objstore.yml

  # these aren't actual chart values
  readinessProbe: &readiness-probe |
    {# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/combine_filter.html #}
    {{ thanos_probe | ansible.builtin.combine({'httpGet':{'path':'/-/ready'  },}, recursive=true) }}
  livenessProbe: &liveness-probe |
    {{ thanos_probe | ansible.builtin.combine({'httpGet':{'path':'/-/healthy'},}, recursive=true) }}

  # ======================================= Query =======================================
  #
  # https://thanos.io/tip/components/query.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-query-parameters
  query:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # https://thanos.io/tip/components/query.md#flags
    extraFlags:
      - --query.max-concurrent=5
      # allow long-window Ruler evaluations to read retained
      # history after raw samples expire; otherwise, a 2-week
      # expression could succeed using only the recent 2-day
      # raw portion and give a misleading result
      - --query.auto-downsampling
      - --query.instant.default.max_source_resolution=1h

    # https://github.com/bitnami/charts/tree/main/bitnami/thanos#resource-requests-and-limits
    # use a preset instead of explicitly configuring resources:
    # none, nano, micro, small, medium, large, xlarge, 2xlarge
    # https://github.com/bitnami/charts/tree/main/bitnami/common/templates/_resources.tpl
    # resourcesPreset: small

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    dnsDiscovery:
      enabled: true
      sidecarsService: "{{ monitoring_release_name }}-thanos-discovery"
      sidecarsNamespace: "{{ monitoring_namespace }}"

    # https://github.com/bitnami/charts/tree/main/bitnami/thanos#securing-traffic-using-tls
    grpc:
      server:
        tls:
          enabled: true
          existingSecret:
            name: "{{ thanos_secrets['query'] }}"
            keyMapping: # mounted under /certs/server
              tls-cert: tls.crt
              tls-key: tls.key
              ca-cert: ca.crt
          clientAuthEnabled: true
      client:
        tls:
          enabled: true
          existingSecret:
            name: "{{ thanos_secrets['query'] }}"
            keyMapping: # mounted under /certs/client
              tls-cert: tls.crt
              tls-key: tls.key
              ca-cert: ca.crt
          # no cert will be generated since existingSecret
          # is set; however, this flag is required so that
          # --grpc-client-tls-skip-verify will be included
          # in the args, or else requests to Store Gateway
          # will fail certificate verification "because it
          # doesn't contain any IP SANs"
          autoGenerated: true

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['query'] }}"

    # referenced by http-config.yml
    # used by all Thanos components
    extraVolumeMounts:
      - &tls-mount
        name: thanos-tls
        mountPath: /tls/thanos
        readOnly: true

    # override default probes in
    # order to supply basic auth
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    ingress:
      enabled: true
      grpc: # in-cluster access only
        enabled: false
      ingressClassName: "{{ rke_ingress_class }}"
      annotations: &ingress-annotations
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        # nginx.ingress.kubernetes.io/ssl-passthrough: "true"
        nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      # both .hostname and .tls are for single
      # FQDN, but since we have multiple FQDNs,
      # configure in .extraHosts and .extraTls
      hostname: ""
      extraHosts: |
        {% set hosts = [] %}
        {% set fqdns = monitoring_fqdns['thanos'][1:]
                         + thanos_fqdns['query'] %}
        {% for fqdn in fqdns %}
        {%   set _ = hosts.append({
               'name':     fqdn,
               'path':     '/',
               'pathType': 'Prefix'
             }) %}
        {% endfor %}
        {{ hosts  }}
      extraTls:
        - secretName: "{{ thanos_secrets['query'] }}"
          hosts: "{{ monitoring_fqdns['thanos'][1:]
            + thanos_fqdns['query'] }}"

  # =================================== Query Frontend ==================================
  #
  # https://thanos.io/tip/components/query-frontend.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-query-frontend-parameters
  queryFrontend:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # override default args because the chart depends on
    # .https.enabled for --query-frontend.downstream-url,
    # but setting .https.enabled creates other .Values.*
    # dependencies and unwanted volumeMounts:
    # https://github.com/bitnami/charts/tree/main/bitnami/thanos/templates/query-frontend/deployment.yaml
    # https://thanos.io/tip/components/query-frontend.md#flags
    args: |
      {%- raw %}
      - query-frontend
      - --log.level={{ .Values.queryFrontend.logLevel }}
      - --log.format={{ .Values.queryFrontend.logFormat }}
      - --http.config=/conf/http/http-config.yml
      - --http-address=0.0.0.0:{{ .Values.queryFrontend.containerPorts.http }}
      # cache config is defined by chart values .queryFrontend.config
      - --query-range.response-cache-config-file=/conf/cache/config.yml
      - --query-frontend.forward-header=Authorization
      # tripper config is defined by Ansible var thanos_tripper_config
      - --query-frontend.downstream-tripper-config-file=/conf/tripper/config.yml
      - --query-frontend.downstream-url=https://{{ include "thanos.query.fullname" . }}.{{
                                  .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{
                                  .Values.query.service.ports.http }}
      {% endraw -%}

    config: |
      type: IN-MEMORY
      config:
        max_size: 64MB
        validity: 5m

    resourcesPreset: nano
    # resources: ~

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['query'] }}"
      - name: tripper-config
        configMap:
          name: thanos-query-frontend-tripper

    extraVolumeMounts:
      - *tls-mount
      - name: tripper-config
        mountPath: /conf/tripper
        readOnly: true

    # override default probes in
    # order to supply basic auth
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    ingress: # in-cluster access only
      enabled: false

  # ======================================= Ruler =======================================
  #
  # https://thanos.io/tip/components/rule.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-ruler-parameters
  ruler:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # default interval
    # see related setting for Prometheus:
    # prometheus_stack_chart_values.prometheus
    #   .prometheusSpec.evaluationInterval
    evalInterval: 1m

    # https://thanos.io/tip/components/rule.md#flags
    extraFlags:
      # supplement default /conf/rules/*.yml
      # Pyrra only uses .yaml ConfigMap keys
      - --rule-file=/conf/pyrra-rules/*.yaml
      # not sure why the chart doesn't
      # allow gRPC server TLS settings
      - --grpc-server-tls-cert=/tls/thanos/tls.crt
      - --grpc-server-tls-key=/tls/thanos/tls.key
      - --grpc-server-tls-client-ca=/tls/thanos/ca.crt
      - --query.config-file=/conf/query-client/query.yml

    # https://thanos.io/tip/components/rule.md#configuring-rules
    config: |
      groups: []

    resourcesPreset: nano
    # resources: ~

    persistence:
      enabled: true
      storageClass: "{{ storage_classes['default'] }}"
      # Prometheus TSDB, which Thanos Ruler uses internally,
      # preallocates chunk segment files in 512Mi increments
      size: 1Gi

    persistentVolumeClaimRetentionPolicy: &pvc-retention-policy
      enabled: true
      whenScaled: Retain
      whenDeleted: Delete

    hostAliases:
      - ip: "127.0.0.1"
        hostnames:
          - "{{ thanos_service_hosts['rule'] }}"

    dnsDiscovery:
      # suppress `--query` arg that causes connection
      # to Query using the unauthenticated HTTP client
      # as opposed to the HTTPS client with basic auth
      enabled: false

    # externally accessible URL in alerts' "Source" field
    queryURL: https://{{ thanos_fqdns['query'] | first }}

    # https://thanos.io/tip/components/rule.md#alertmanager
    alertmanagersConfig:
      alertmanagers:
        - api_version: v2
          # https://thanos.io/tip/thanos/service-discovery.md#thanos-ruler
          static_configs:
            - "{{ alertmanager_service_host }}:{{ alertmanager_service_port }}"
          scheme: https
          http_config:
            tls_config:
              # same cert as http-config.yml
              cert_file: /tls/thanos/tls.crt
              key_file: /tls/thanos/tls.key
              ca_file: /tls/thanos/ca.crt

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['rule'] }}"
      - name: query-client
        secret:
          secretName: "{{ thanos_secrets['query-client'] }}"
      - name: pyrra-rules
        emptyDir: {}

    extraVolumeMounts:
      - *tls-mount
      - name: query-client
        mountPath: /conf/query-client
        readOnly: true
      - name: pyrra-rules
        mountPath: /conf/pyrra-rules
        readOnly: true

    # override default probes in
    # order to supply basic auth
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    ingress:
      enabled: true
      ingressClassName: "{{ rke_ingress_class }}"
      annotations: *ingress-annotations
      # both .hostname and .tls are for single
      # FQDN, but since we have multiple FQDNs,
      # configure in .extraHosts and .extraTls
      hostname: ""
      extraHosts: |
        {% set hosts = [] %}
        {% for fqdn in thanos_fqdns['rule'] %}
        {%   set _ = hosts.append({
               'name':     fqdn,
               'path':     '/',
               'pathType': 'Prefix'
             }) %}
        {% endfor %}
        {{ hosts  }}
      extraTls:
        - secretName: "{{ thanos_secrets['rule'] }}"
          hosts: "{{ thanos_fqdns['rule'] }}"

    sidecars:
      # deploy sidecar that watches Pyrra rule ConfigMaps having
      # label `pyrra-rule: "true"`, writes .yaml rule files into
      # shared volume, and triggers Thanos Ruler to reload rules
      - name: pyrra-rules
        # https://github.com/kiwigrid/k8s-sidecar
        # `skopeo list-tags docker://ghcr.io/kiwigrid/k8s-sidecar`
        image: ghcr.io/kiwigrid/k8s-sidecar:2.13.3
        imagePullPolicy: IfNotPresent

        env:
          # k8s-sidecar is a Python app, so disable creation
          # of "__pycache__/*.pyc" files since the container
          # has a read-only root filesystem
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: METHOD
            value: WATCH
          - name: RESOURCE
            value: configmap
          - name: NAMESPACE
            value: ALL
          - name: SKIP_TLS_VERIFY
            value: "false"
          - name: LABEL
            value: "{{ pyrra_rule_selector_labels.items()[0][0] }}"
          - name: LABEL_VALUE
            value: "{{ pyrra_rule_selector_labels.items()[0][1] }}"
          - name: FOLDER
            value: /rules/pyrra
          - name: UNIQUE_FILENAMES
            value: "true"
          - name: DEFAULT_FILE_MODE
            value: "640"
          - name: REQ_METHOD
            value: POST
          - name: REQ_URL
            # host name resolves to 127.0.0.1 per `ruler.hostAliases` above
            value: https://{{ thanos_service_hosts['rule'] }}:10902/-/reload
          - name: REQ_SKIP_TLS_VERIFY
            value: "false"
          - name: REQUESTS_CA_BUNDLE
            value: /tls/thanos/ca.crt
          - name: REQ_USERNAME
            value: thanos
          - name: REQ_PASSWORD
            valueFrom:
              secretKeyRef:
                # all Thanos components have same basic auth
                name: "{{ thanos_secrets['query-client'] }}"
                key: password

        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        resources:
          requests:
            cpu: 5m
            memory: 128Mi

        readinessProbe: &sidecar-probe
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6

        livenessProbe:
          <<: *sidecar-probe
          initialDelaySeconds: 30

        volumeMounts:
          - name: pyrra-rules
            mountPath: /rules/pyrra
          - name: thanos-tls
            mountPath: /tls/thanos/ca.crt
            subPath: ca.crt
            readOnly: true

  # =================================== Store Gateway ===================================
  #
  # https://thanos.io/tip/components/store.md#index-cache
  indexCacheConfig: |
    type: IN-MEMORY
    config:
      max_size: 128MB

  # https://thanos.io/tip/components/store.md#caching-bucket
  # https://thanos.io/tip/components/store.md#redis-index-cache
  bucketCacheConfig: |
    type: REDIS
    config:
      addr: {{ valkey_node_eps | first }}
      password: {{ valkey_pass }}
      tls_enabled: true
      tls_config:
        # same cert as http-config.yml
        cert_file: /tls/thanos/tls.crt
        key_file:  /tls/thanos/tls.key
        ca_file:   /tls/thanos/ca.crt
      # prefix requires v0.42.0+
      prefix: '#thanos#:'
      cache_size: 128MB
      dial_timeout: 10s
      read_timeout:  5s
      write_timeout: 5s
      max_async_concurrency: 50
      max_get_multi_concurrency: 50
      max_set_multi_concurrency: 10
      get_multi_batch_size: 50
      set_multi_batch_size: 10

  # https://thanos.io/tip/components/store.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-store-gateway-parameters
  storegateway:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # https://thanos.io/tip/components/store.md#flags
    extraFlags:
      - --store.grpc.series-max-concurrency=5
      - --chunk-pool-size=128MB

    # shard using StatefulSet based on
    # time ranges or hashmod of blocks
    # https://thanos.io/tip/components/store.md#time-based-partitioning
    sharded:
      enabled: false

    # resourcesPreset: medium
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 6Gi

    persistence:
      enabled: true
      storageClass: "{{ storage_classes['default'] }}"
      size: 3Gi
    persistentVolumeClaimRetentionPolicy: *pvc-retention-policy

    grpc:
      server:
        tls:
          enabled: true
          existingSecret:
            name: "{{ thanos_secrets['store'] }}"
            keyMapping: # mounted under /certs/server
              tls-cert: tls.crt
              tls-key: tls.key
              ca-cert: ca.crt
          clientAuthEnabled: true

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['store'] }}"

    extraVolumeMounts:
      - *tls-mount

    # override default probes in order to supply basic auth;
    # also, use startup probe because store gateway can take
    # a long time on initial bucket sync: loading new blocks
    customStartupProbe: |
      {{ thanos_probe | ansible.builtin.combine({
           'httpGet':{'path':'/-/ready'},
           'initialDelaySeconds': 0,
           'failureThreshold': 120,
         }, recursive=true) }}
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    # make Query access Store API using
    # "endpoint-group" feature if there
    # are multiple replicas
    useEndpointGroup: false

    ingress:
      enabled: true
      grpc: # in-cluster access only
        enabled: false
      ingressClassName: "{{ rke_ingress_class }}"
      annotations: *ingress-annotations
      # both .hostname and .tls are for single
      # FQDN, but since we have multiple FQDNs,
      # configure in .extraHosts and .extraTls
      hostname: ""
      extraHosts: |
        {% set hosts = [] %}
        {% for fqdn in thanos_fqdns['store'] %}
        {%   set _ = hosts.append({
               'name':     fqdn,
               'path':     '/',
               'pathType': 'Prefix'
             }) %}
        {% endfor %}
        {{ hosts  }}
      extraTls:
        - secretName: "{{ thanos_secrets['store'] }}"
          hosts: "{{ thanos_fqdns['store'] }}"

  # ===================================== Bucket Web ====================================
  #
  # https://thanos.io/tip/components/tools.md#bucket-web
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-bucket-web-parameters
  bucketweb:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # interval to refresh bucket metadata
    refresh: 30m

    resourcesPreset: nano
    # resources: ~

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['bucket'] }}"

    extraVolumeMounts:
      - *tls-mount

    # override default probes in
    # order to supply basic auth
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    ingress:
      enabled: true
      ingressClassName: "{{ rke_ingress_class }}"
      annotations: *ingress-annotations
      # both .hostname and .tls are for single
      # FQDN, but since we have multiple FQDNs,
      # configure in .extraHosts and .extraTls
      hostname: ""
      extraHosts: |
        {% set hosts = [] %}
        {% for fqdn in thanos_fqdns['bucket'] %}
        {%   set _ = hosts.append({
               'name':     fqdn,
               'path':     '/',
               'pathType': 'Prefix'
             }) %}
        {% endfor %}
        {{ hosts  }}
      extraTls:
        - secretName: "{{ thanos_secrets['bucket'] }}"
          hosts: "{{ thanos_fqdns['bucket'] }}"

  # ===================================== Compactor =====================================
  #
  # https://thanos.io/tip/components/compact.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-compactor-parameters
  compactor:
    enabled: true
    revisionHistoryLimit: "{{ k8s_max_revisions }}"

    # https://thanos.io/tip/components/compact.md#flags
    extraFlags:
      # since Prometheus accepts samples arriving up to 5 seconds
      # out of order (`tsdb.outOfOrderTimeWindow=5s`) they can be
      # written into separate blocks, overlapping ordinary blocks
      # https://thanos.io/tip/components/compact.md#vertical-compactions
      - --compact.enable-vertical-compaction

    # deploy as a service
    # instead of cron job
    cronJob:
      enabled: false

    retentionResolutionRaw: 2d
    retentionResolution5m: 14d # raw metrics older than 2 days
    retentionResolution1h: 30d #  5m metrics older than 2 weeks

    # number of goroutines to
    # use when compact groups
    concurrency: 1
    # minimum age of fresh (non-compacted)
    # blocks before they can be processed
    consistencyDelay: 30m

    # resourcesPreset: small
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 500m
        memory: 1Gi

    persistence:
      enabled: true
      ephemeral: false
      # no need for replicas as storage
      # is used merely as scratch space
      storageClass: "{{ storage_classes['single'] }}"
      size: 10Gi

    extraVolumes:
      - name: thanos-tls
        secret:
          secretName: "{{ thanos_secrets['compact'] }}"

    extraVolumeMounts:
      - *tls-mount

    # override default probes in
    # order to supply basic auth
    customReadinessProbe: *readiness-probe
    customLivenessProbe: *liveness-probe

    ingress:
      enabled: true
      ingressClassName: "{{ rke_ingress_class }}"
      annotations: *ingress-annotations
      # both .hostname and .tls are for single
      # FQDN, but since we have multiple FQDNs,
      # configure in .extraHosts and .extraTls
      hostname: ""
      extraHosts: |
        {% set hosts = [] %}
        {% for fqdn in thanos_fqdns['compact'] %}
        {%   set _ = hosts.append({
               'name':     fqdn,
               'path':     '/',
               'pathType': 'Prefix'
             }) %}
        {% endfor %}
        {{ hosts  }}
      extraTls:
        - secretName: "{{ thanos_secrets['compact'] }}"
          hosts: "{{ thanos_fqdns['compact'] }}"

  # ====================================== Receive ======================================
  #
  # https://thanos.io/tip/components/receive.md
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#thanos-receive-parameters
  receive:
    enabled: false
  receiveDistributor:
    enabled: false

  # ====================================== Metrics ======================================
  #
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#metrics-parameters
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      labels: "{{ monitoring_selector_labels }}"
      extraParameters:
        scheme: https
        # TLSConfig (mTLS client certificate):
        # https://github.com/prometheus-operator/prometheus-operator/tree/main/Documentation/api-reference/api.md#safetlsconfig
        tlsConfig: "{{ metric_scraper_tls_config }}"
        # https://github.com/prometheus-operator/prometheus-operator/tree/main/Documentation/api-reference/api.md#basicauth
        basicAuth: "{{ thanos_metrics_auth }}"

    prometheusRule:
      enabled: true
      additionalLabels: "{{ monitoring_selector_labels }}"

  # ======================================= Extras ======================================
  #
  # https://github.com/bitnami/charts/tree/main/bitnami/thanos#deploy-extra-resources
  extraDeploy:
    # allow Thanos Ruler k8s-sidecar to read
    # ConfigMaps and write them as rule files
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ thanos_release_name }}-configmap-reader"
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs:
            - get
            - list
            - watch

    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ thanos_release_name }}-configmap-reader"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ thanos_release_name }}-configmap-reader"
      subjects:
        - kind: ServiceAccount
          namespace: "{{ monitoring_namespace }}"
          name: "{{ thanos_release_name }}-ruler"
