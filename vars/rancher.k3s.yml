# https://docs.k3s.io/reference/env-variables
# https://docs.k3s.io/cli/server

# NOTE: K3s version may be held back by
# Rancher Server Helm chart requirements
# https://github.com/k3s-io/k3s/releases
# k3s_version: v1.34.3+k3s1 # 12/15/2025
k3s_version: v1.35.5+k3s1 # 5/20/2026

# k3s_token: {vault.yml}

# curl -sfL https://get.k3s.io | \
#   sh -s - server [opts...]
k3s_opts:
  - --token '{{ k3s_token }}'
  - --tls-san {{ k3s_fqdn }}
  - --cluster-cidr {{ cluster_cidr }}
  - --service-cidr {{ service_cidr }}
  - --write-kubeconfig {{ k3s_kubeconfig }}
  - --write-kubeconfig-mode 644

  # https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources
  # confirm afterwards by running on a cluster node:
  # { kubectl proxy & } && sleep .5
  # curl -s http://127.0.0.1:8001/api/v1/nodes/rancher/proxy/configz | \
  #   jq '.kubeletconfig | {kubeReserved,systemReserved,evictionHard,enforceNodeAllocatable}'
  # kill %1 && fg
  - --kubelet-arg=kube-reserved=cpu=250m,memory=512Mi
  - --kubelet-arg=system-reserved=cpu=250m,memory=512Mi
  - --kubelet-arg='eviction-hard=memory.available<512Mi'
