# pass the following vars:
#   vcluster <required> object {name,node}
---
- name: Gather facts about controller
  # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_tasks_module.html
  ansible.builtin.include_tasks: "{{ tasks_dir }}/localfacts.yml"
  when: local_python_interpreter is undefined

- name: Delete vCluster "{{ vcluster.name }}"
  become: false
  block:
    - name: Get pods deployed in namespace
      delegate_to: localhost
      vars: &localhost_vars
        ansible_python_interpreter: "{{ local_python_interpreter }}"
        # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/env_lookup.html
        user_kubeconfig: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config"
      # https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_info_module.html
      kubernetes.core.k8s_info:
        kubeconfig: "{{ user_kubeconfig }}"
        # 'x' prefix defined by create.yml
        context: x{{ vcluster.name }}
        api_version: v1
        kind: Pod
      register: get_tenant_pods
      # best-effort basis only!
      failed_when: false

    - name: Ignore vCluster-deployed pods
      vars:
        vc_pods: "{{ get_tenant_pods.resources | default([]) }}"
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/set_fact_module.html
      ansible.builtin.set_fact:
        vcluster_user_pods: |
          {% set pods = [] %}
          {% for meta in vc_pods | map(attribute='metadata') %}
          {%   set desc = meta.namespace ~'/'~ meta.name     %}
          {#   https://jinja.palletsprojects.com/en/stable/templates#assignments #}
          {%   set pod = namespace(desc=desc, found=false) %}
          {%   for regex in vcluster_control_plane_pods %}
          {%     set pod.found = pod.found or pod.desc  |
                   ansible.builtin.regex_search(regex) %}
          {%   endfor %}
          {%   if not pod.found %}
          {%     set _ = pods.append(pod.desc) %}
          {%   endif %}
          {% endfor  %}
          {{ pods    }}

    - name: Show pods deployed in namespace
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/debug_module.html
      ansible.builtin.debug:
        msg: "{{ vcluster_user_pods | join(LF) }}"
      when: vcluster_user_pods is truthy

    - name: Prompt for confirmation
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/pause_module.html
      ansible.builtin.pause:
        prompt: Delete vCluster? (y/n)
      when: vcluster_user_pods is truthy
      register: confirm_delete

    - name: Continue with deletion
      when: >-
        confirm_delete.user_input is undefined or
        confirm_delete.user_input  | lower == 'y'
      vars:
        # required kubernetes>=24.2 package only in user virtualenv
        ansible_python_interpreter: "{{ venv_python_interpreter }}"
        vcluster_ns: vcluster-{{ vcluster.name }}
      block:
        - name: Uninstall vCluster tenant Helm release
          # https://docs.ansible.com/ansible/latest/collections/kubernetes/core/helm_module.html
          kubernetes.core.helm:
            kubeconfig: "{{ kubeconfig }}"
            release_name: "{{ vcluster.name }}"
            release_namespace: "{{ vcluster_ns }}"
            release_state: absent
            wait: true
          # during handling of Helm install failure, atomic
          # install will have already deleted all resources
          when: >-
            helm_install is undefined or
            helm_install.status.name  != vcluster.name
          register: helm_uninstall

        - name: Delete VirtualClusterInstance resource
          # https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            api_version: management.loft.sh/v1
            kind: VirtualClusterInstance
            name: "{{ vcluster.name }}"
            namespace: "{{ vcluster_project_namespace }}"
            state: absent
            wait: true

        - name: Delete namespace "{{ vcluster_ns }}"
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            api_version: v1
            kind: Namespace
            name: "{{ vcluster_ns }}"
            state: absent
            wait: true
          # might take a while to kill non-vCluster
          # resources deployed inside the namespace
          timeout: 300

        - name: Delete vCluster persistent volumes
          vars:
            pv_names:
              # - "{{ vcluster_ns }}-etcd-pv"
              - "{{ vcluster_ns }}-data-pv"
          block:
            # should run quickly as bound PVC should
            # have been deleted by namespace removal
            - name: Delete vCluster persistent volume
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig }}"
                api_version: v1
                kind: PersistentVolume
                name: "{{ item }}"
                state: absent
                wait: true
              loop: "{{ pv_names }}"

            - name: Delete node-local file system path
              delegate_to: "{{ vcluster.node }}"
              become: true
              # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html
              ansible.builtin.file:
                path: "{{ data_lv.mount ~'/'~ item }}"
                state: absent
              loop: "{{ pv_names }}"

        - name: Delete local kubeconfig context
          delegate_to: localhost
          vars:
            <<: *localhost_vars
          # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig={{ user_kubeconfig }}
              - config
              - unset
              # 'x' prefix defined by create.yml
              - "{{ item }}.x{{ vcluster.name }}"
          loop:
            - contexts
            - users
            - clusters
          when:
            - helm_uninstall is defined
            - helm_uninstall is changed
          changed_when: true
