[class]

text_default = [
  { command = "bat", args = [
    "--paging", "always",
    # -+F to force paging, even for short files
    # -S  to disable line-wrap; force scrolling
    # -c  to force repaint from top of screen
    "--pager", "less -+F -cRSKLMin",
  ] },
]

image_default = [
  { command = "code", args = [
    "-r",
  ], fork = true, silent = true },
]

audio_default = [
  { command = "mpv", args = [
    "--",
  ], fork = true, silent = true },
]

video_default = [
  { command = "mpv", args = [
    "--",
  ], fork = true, silent = true },
]

reader_default = [
  { command = "code", args = [
    "-r",
  ], fork = true, silent = true },
]
libreoffice_default = [
  { command = "libreoffice", fork = true, silent = true },
]

