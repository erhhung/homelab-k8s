# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 4

iterm_features:
  - current_dir
  - remote_host

enable_cursor_positioning: true
final_space: true

blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: "#888888"
        template: ╭─
      - type: path
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: "#e4e4e4"
        background: "#404040"
        template: "<b>{{ replaceP \"^/\" (replaceP \"^~<#ddee80>∕</>\" .Path \" \") \"<#ddee80>∕</>\" }}</>"
        options:
          style: full
          folder_separator_icon: "<#ddee80>∕</>"
      - type: aws
        style: diamond
        trailing_diamond: 
        foreground: "#2f2f40"
        background: "#30c8a8"
        template: "  {{ .Profile }}{{ if .Region }} ⁞ {{ .Region }}{{ end }}"
        options:
          display_default: false
      - type: kubectl
        style: diamond
        trailing_diamond: 
        foreground: "#e4e4e4"
        background: "#1060c0"
        template: " ⎈ {{ .Context }} ⁞ {{ or .Namespace \"default\" }}"
      - type: python
        style: diamond
        trailing_diamond: 
        foreground: "#96e072"
        background: "#2f2f2f"
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}</>"
      - type: git
        style: diamond
        trailing_diamond: 
        foreground: "#011620"
        background: "#fffb40"
        template: " {{ .HEAD }} {{ if .Working.Changed }}{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#ef5350>  {{ .Staging.String }}</>{{ end }}"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#ffeb95{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#c5e478{{ end }}"
          - "{{ if gt .Ahead 0 }}#c792ea{{ end }}"
          - "{{ if gt .Behind 0 }}#c792ea{{ end }}"
        options:
          branch_icon: " "
          fetch_status: true
          fetch_upstream_icon: true

  - type: prompt
    alignment: right
    segments:
      - type: executiontime
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: "#ffffff"
        background: "#d770a0"
        template:  {{ .FormattedMs }}
        options:
          style: austin
          always_enabled: true
      - type: time
        style: diamond
        trailing_diamond: 
        foreground: "#ffffff"
        background: "#1888c0"
        template: " {{ .CurrentDate | date .Format | trimSuffix \"m\" }}"
        options:
          time_format: 3:04:05pm

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        template: "<#888888>╰─"
      - type: root
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: "#fffb38"
        background: "#ef5350"
        template: ""
      - type: status
        style: diamond
        template: "<b>{{ if not .Root }}<{{ if eq .Code 0 }}#fffb38{{ else }}#ef5350{{ end }}>❯{{ end }}</>"
        options:
          always_enabled: true

secondary_prompt:
  foreground: "#ffffff"
  background: transparent
  template: "  <b>{{ if .Root }}  {{ else }}❯{{ end }}</> "
